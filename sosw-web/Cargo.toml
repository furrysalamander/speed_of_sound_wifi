[package]
name = "sosw-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sosw-core = { path = "../sosw-core" }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "AudioContext", "AudioContextOptions", "ScriptProcessorNode",
    "AudioProcessingEvent",
    "MediaStream", "MediaStreamAudioSourceNode", "MediaDevices",
    "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData",
    "AudioBuffer", "AudioNode", "AudioDestinationNode",
    "MediaStreamConstraints",
    "Window", "Navigator",
    "HtmlElement", "Document", "Element",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
