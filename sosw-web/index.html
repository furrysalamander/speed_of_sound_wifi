<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speed of Sound WiFi</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface2: #252525;
            --border: #333;
            --primary: #4fc3f7;
            --danger: #e53935;
            --on-surface: #e0e0e0;
            --text-secondary: #888;
            --text-muted: #aaa;
            --radius: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.24);
            --shadow-lg: 0 3px 6px rgba(0,0,0,.4), 0 3px 6px rgba(0,0,0,.32);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--on-surface);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        .app { max-width: 900px; margin: 0 auto; padding: 1rem; }

        h1 {
            font-size: 1.25rem;
            font-weight: 400;
            margin-bottom: .75rem;
            color: var(--primary);
            letter-spacing: .02em;
        }

        /* ── Tabs ─────────────────────────────────── */

        .tabs { display: flex; gap: 1px; margin-bottom: 1rem; }

        .tab {
            padding: .5rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: .8125rem;
            font-weight: 500;
            letter-spacing: .06em;
            text-transform: uppercase;
            transition: background .15s, color .15s;
        }
        .tab:first-child { border-radius: var(--radius) 0 0 var(--radius); }
        .tab:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
        .tab:hover { background: var(--surface2); color: var(--on-surface); }
        .tab.active {
            background: var(--surface2);
            color: var(--primary);
            border-color: var(--primary);
        }

        /* ── Card / Panel ─────────────────────────── */

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 1.25rem;
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
        }

        /* ── Button ───────────────────────────────── */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            padding: 0 1rem;
            background: var(--primary);
            color: #111;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: .8125rem;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            cursor: pointer;
            transition: box-shadow .2s, filter .2s;
            user-select: none;
        }
        .btn:hover { box-shadow: 0 2px 8px rgba(79,195,247,.35); }
        .btn:active { filter: brightness(.85); }
        .btn:disabled { opacity: .35; cursor: default; box-shadow: none; filter: none; }
        .btn.small { height: 28px; padding: 0 .625rem; font-size: .6875rem; }
        .btn.active { background: var(--primary); color: #111; }
        .btn-stop { background: var(--danger) !important; color: #fff !important; }
        .btn-stop:hover { box-shadow: 0 2px 8px rgba(229,57,53,.35) !important; }

        /* ── Layout helpers ───────────────────────── */

        .row { display: flex; gap: .625rem; align-items: center; margin: .5rem 0; flex-wrap: wrap; }

        .status {
            font-size: .8125rem;
            color: var(--text-muted);
        }

        /* ── Stats grid ───────────────────────────── */

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .5rem;
            margin: .75rem 0;
        }

        .stat {
            background: var(--surface2);
            padding: .375rem .625rem;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .stat label {
            display: block;
            font-size: .65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: 1px;
        }
        .stat .val {
            font-size: .9375rem;
            font-weight: 600;
            color: var(--on-surface);
        }

        /* ── Details / Accordion ──────────────────── */

        details { margin-top: .5rem; }
        summary {
            cursor: pointer;
            font-weight: 600;
            font-size: .875rem;
            color: var(--primary);
            padding: .25rem 0;
            outline: none;
            user-select: none;
        }

        /* ── Form controls ────────────────────────── */

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
            flex: 1;
            min-width: 80px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: 2px solid var(--surface);
        }
        input[type=range]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: 2px solid var(--surface);
        }

        progress {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: var(--border);
            border: none;
        }
        progress::-webkit-progress-bar { background: var(--border); border-radius: 3px; }
        progress::-webkit-progress-value { background: var(--primary); border-radius: 3px; transition: width .25s ease; }
        progress::-moz-progress-bar { background: var(--primary); border-radius: 3px; }

        label {
            font-size: .8125rem;
            color: var(--text-secondary);
        }

        select {
            background: var(--surface2);
            color: var(--on-surface);
            border: 1px solid var(--border);
            padding: .375rem .5rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: .8125rem;
        }

        /* ── Canvas ───────────────────────────────── */

        canvas {
            width: 100%;
            background: #000;
            border-radius: 4px;
            margin: .5rem 0;
        }
        canvas#waterfall-rx { height: 200px; }

        /* ── Misc ─────────────────────────────────── */

        p { font-size: .8125rem; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
