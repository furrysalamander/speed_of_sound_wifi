<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speed of Sound WiFi</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #111; color: #eee; min-height: 100vh; }
        .app { max-width: 900px; margin: 0 auto; padding: 1rem; }
        h1 { font-size: 1.4rem; margin-bottom: 0.5rem; color: #4fc3f7; }
        .tabs { display: flex; gap: 2px; margin-bottom: 1rem; }
        .tab { padding: 0.5rem 1rem; background: #222; border: none; color: #888; cursor: pointer; }
        .tab.active { background: #333; color: #fff; border-bottom: 2px solid #4fc3f7; }
        .panel { background: #1a1a1a; border-radius: 8px; padding: 1rem; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 0.5rem 0; }
        .stat { background: #222; padding: 0.4rem 0.6rem; border-radius: 4px; }
        .stat label { font-size: 0.7rem; color: #888; display: block; }
        .stat value { font-size: 1rem; font-weight: bold; }
        canvas { width: 100%; height: 200px; background: #000; border-radius: 4px; margin: 0.5rem 0; }
        button { background: #4fc3f7; color: #111; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { opacity: 0.4; cursor: default; }
        button.danger { background: #e53935; }
        select, input { background: #222; color: #eee; border: 1px solid #444; padding: 0.4rem; border-radius: 4px; }
        .row { display: flex; gap: 0.5rem; align-items: center; margin: 0.5rem 0; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
